[package]
name = "mica-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

# mica-core must never import Metal or AppKit. `xtask`/CI enforces this; see
# BUILD-ORDER.md risk register, "Crate boundary erodes".
[dependencies]
libc.workspace = true
serde.workspace = true
toml.workspace = true

alacritty_terminal = { workspace = true, optional = true }

[features]
# `alacritty` is the default while Zig 0.16.x (a libghostty-vt build
# dependency) is not installed. The trait boundary is what makes this a real
# option rather than a consolation.
default = ["alacritty"]
alacritty = ["dep:alacritty_terminal"]
ghostty = []
